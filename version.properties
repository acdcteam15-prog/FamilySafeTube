# Marketing version shown in the app (Settings -> App updates). Edit this when you want a new "1.x.y".
versionName=1.8.0

# Every build gets versionCode = versionCodeOffset + the GitHub Actions run number, so it always goes up.
# (The release file is named FamilySafeTube-<versionName>-build<versionCode>.apk.)
# The offset is above every versionCode this app has ever had, so the first GitHub build installs over the old one.
versionCodeOffset=100
