# Single place for every version. Dependabot (see .github/dependabot.yml) opens a PR whenever one is outdated.
# Looked up in the official sources on 2026-11-01: developer.android.com (AGP, AndroidX), GitHub releases (the rest).
[versions]
agp = "9.5.0"            # needs Gradle 9.6.0 or newer (the wrapper has 9.8.2) and JDK 17+ (CI uses 21)
kotlin = "2.4.21"        # AGP 9 compiles Kotlin itself; this version is used by the Compose compiler plugin
core = "1.19.1"
appcompat = "1.8.0"
activity = "1.13.0"
lifecycle = "2.11.0"
work = "2.12.0"
datastore = "1.3.0"
viewpager2 = "1.1.0"
compose = "1.12.1"
material3 = "1.4.0"
media3 = "1.11.1"
okhttp = "5.5.1"
glide = "5.0.9"
material = "1.14.0"          # Google sign-in's own screens use Theme.MaterialComponents; its resources must exist at build time
playServicesAuth = "22.0.0"   # Google sign-in / Drive authorization (AuthorizationClient)
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
material = { module = "com.google.android.material:material", version.ref = "material" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
